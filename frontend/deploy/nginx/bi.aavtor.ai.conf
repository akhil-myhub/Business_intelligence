# Nginx reverse proxy for bi.aavtor.ai -> Docker container on 127.0.0.1:3547
#
# Install on the server:
#   sudo tee /etc/nginx/sites-available/bi.aavtor.ai.conf < this file
#   sudo ln -s /etc/nginx/sites-available/bi.aavtor.ai.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (rewrites this file to add the :443 block + http->https redirect):
#   sudo certbot --nginx -d bi.aavtor.ai

server {
    listen 80;
    listen [::]:80;
    server_name bi.aavtor.ai;

    # Let certbot answer the ACME challenge for TLS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3547;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # Live feed + question stream are Server-Sent Events: never buffer them,
    # or the stream appears frozen until it ends.
    location ~ ^/api/(live|query) {
        proxy_pass http://127.0.0.1:3547;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
