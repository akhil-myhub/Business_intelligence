name: CI / CD

# CI runs on every push and PR. CD (deploy to the server) runs only on pushes to main.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Quality gate: lint + unit tests + production build ──────────────────────
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22            # matches the Dockerfile (node:22-alpine)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Prefer the reproducible clean install; fall back to npm install when the
      # committed lock omits this platform's optional native deps (same reason
      # the Dockerfile uses the fallback).
      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Build into a throwaway dir (next.config.mjs honours NEXT_DIST_DIR) so the
      # standalone output is produced and type/compile errors fail the gate.
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ── Docker build sanity: make sure the image actually builds ────────────────
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: businessai-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy: SSH to the server, pull, rebuild the container ──────────────────
  # Runs only on pushes to main (not PRs, not master). Requires the repo secrets
  # below (Settings → Secrets and variables → Actions):
  #   DEPLOY_HOST        e.g. 164.52.194.4
  #   DEPLOY_USER        e.g. root
  #   DEPLOY_SSH_KEY     a private key whose public key is in the server's authorized_keys
  #   DEPLOY_PATH        e.g. ~/bi-aavtor  (repo root on the server)
  #   DEPLOY_SSH_PORT    optional, defaults to 22
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [verify, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false      # never interrupt a deploy mid-flight
    environment:
      name: production
      url: https://bi.aavtor.ai
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          # The server keeps its own .env (secrets live only there, never in git).
          # We pull the branch, rebuild and recreate the container, then wait for
          # the health check to report ok before declaring success.
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}/frontend"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main
            docker compose up -d --build --force-recreate
            docker image prune -f
            echo "Waiting for health check..."
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3547/api/health >/dev/null; then
                echo "Healthy."; exit 0
              fi
              sleep 3
            done
            echo "Health check did not pass in time"; exit 1
